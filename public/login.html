<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf6ef">
<title>岁语 · 登录</title>
<style>
  :root {
    --brand: #b4531f;
    --brand-soft: #c96a34;
    --ink: #3f3a32;
    --dim: #7c7468;
    --line: #e7dfd2;
    --panel: #fffdf8;
    --bg: #faf6ef;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 15% 0%, #fff8e9 0%, var(--bg) 55%, #f3ede1 100%);
    color: var(--ink);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: min(460px, 100%);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(90, 70, 45, .16);
    padding: 34px 32px 30px;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .mark {
    width: 48px; height: 48px; border-radius: 15px;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--brand), #d98243);
    color: #fff; font-size: 26px; font-weight: 700;
    box-shadow: 0 8px 18px rgba(180, 83, 31, .28);
  }
  h1 { font-size: 27px; margin: 0; letter-spacing: 1px; }
  .sub { color: var(--dim); font-size: 15px; line-height: 1.7; margin: 10px 0 22px; }
  .tabs { display: flex; gap: 8px; background: #f3ede1; padding: 5px; border-radius: 15px; margin-bottom: 22px; }
  .tabs button {
    flex: 1; min-height: 46px; border: none; border-radius: 11px;
    background: transparent; color: var(--dim); font: inherit; font-size: 17px; cursor: pointer;
  }
  .tabs button.on { background: #fff; color: var(--brand); font-weight: 700; box-shadow: 0 2px 8px rgba(90, 70, 45, .10); }
  label { display: block; font-size: 15px; color: var(--dim); margin: 14px 0 7px; }
  input {
    width: 100%; min-height: 54px; padding: 0 16px;
    font: inherit; font-size: 18px; color: var(--ink);
    border: 1px solid var(--line); border-radius: 14px; background: #fff;
    outline: none;
  }
  input:focus { border-color: var(--brand-soft); box-shadow: 0 0 0 4px rgba(201, 106, 52, .13); }
  .submit {
    width: 100%; min-height: 58px; margin-top: 24px;
    border: none; border-radius: 16px;
    background: var(--brand); color: #fff;
    font: inherit; font-size: 20px; font-weight: 700; cursor: pointer;
  }
  .submit:disabled { opacity: .6; cursor: default; }
  .msg { min-height: 24px; margin-top: 14px; font-size: 15px; line-height: 1.6; color: #a8381c; }
  .msg.ok { color: #2f8f5b; }
  .foot { margin-top: 18px; font-size: 13px; color: #a59c8d; line-height: 1.6; text-align: center; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <span class="mark">岁</span>
    <h1>岁语</h1>
  </div>
  <p class="sub">登录后才是您自己的记忆、照片、吃药提醒和记事本 —— 不同账号的数据完全分开。</p>

  <div class="tabs">
    <button id="tabLogin" class="on">登录</button>
    <button id="tabRegister">注册新账号</button>
  </div>

  <form id="form" autocomplete="on">
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" placeholder="2–20 个字" maxlength="20">
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="至少 6 位">
    <button class="submit" id="submit">登录</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="foot">第一次使用请先注册。账号只存在本机 MySQL 里，不联网。</div>
</main>
<script>
const $ = (id) => document.getElementById(id);
let mode = 'login';

function setMode(next) {
  mode = next;
  $('tabLogin').classList.toggle('on', mode === 'login');
  $('tabRegister').classList.toggle('on', mode === 'register');
  $('submit').textContent = mode === 'login' ? '登录' : '注册并登录';
  $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  $('msg').className = 'msg';
  $('msg').textContent = '';
}

$('tabLogin').onclick = () => setMode('login');
$('tabRegister').onclick = () => setMode('register');

$('form').onsubmit = async (e) => {
  e.preventDefault();
  const username = $('username').value.trim();
  const password = $('password').value;
  if (!username || !password) { $('msg').textContent = '用户名和密码都要填'; return; }
  $('submit').disabled = true;
  $('msg').className = 'msg';
  $('msg').textContent = '';
  try {
    const r = await fetch('/api/auth/' + (mode === 'login' ? 'login' : 'register'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok || !data.ok) {
      $('msg').textContent = data.error || '没成功，再试一次';
      return;
    }
    $('msg').className = 'msg ok';
    $('msg').textContent = (mode === 'login' ? '登录成功' : '注册成功') + '，正在进入…';
    try { localStorage.removeItem('seyo.session'); } catch { /* ignore */ }
    const next = new URLSearchParams(location.search).get('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch (err) {
    $('msg').textContent = '连不上服务：' + err.message;
  } finally {
    $('submit').disabled = false;
  }
};

fetch('/api/auth/me').then((r) => {
  if (!r.ok) return;
  const next = new URLSearchParams(location.search).get('next');
  location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
}).catch(() => {});
</script>
<script src="/kioskexit.js"></script>
<script src="/vkbd.js"></script>
</body>
</html>
